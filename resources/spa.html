<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f14">
<title>Tackle Remote</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #121820; --panel-2: #1a222c; --line: #223041;
    --text: #e8edf2; --dim: #8fa1b3; --accent: #34d399; --warn: #fbbf24;
    --danger: #f87171; --user: #2563eb;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.idle { background: var(--accent); }
  .dot.running { background: var(--warn); animation: pulse 1.2s infinite; }
  .dot.waiting { background: var(--danger); animation: pulse 0.8s infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  header .title { font-weight: 600; font-size: 15px; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  .budget { text-align: right; font-size: 12px; color: var(--dim); }
  .budget b { color: var(--text); font-variant-numeric: tabular-nums; }
  .budget .bar { width: 90px; height: 4px; background: var(--panel-2); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .budget .bar i { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .3s; }
  .budget .bar i.hot { background: var(--danger); }
  .clear-btn {
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2);
    color: var(--dim); font: inherit; font-size: 14px; width: 34px; height: 34px; flex: none;
  }

  main { flex: 1; overflow-y: auto; padding: 14px 12px 18px; -webkit-overflow-scrolling: touch; }
  .msg { max-width: 88%; margin: 0 0 10px; padding: 10px 13px; border-radius: 14px;
         white-space: pre-wrap; overflow-wrap: break-word; }
  .msg.user { background: var(--user); margin-left: auto; border-bottom-right-radius: 4px; }
  .msg.agent { background: var(--panel-2); border-bottom-left-radius: 4px; }
  .chip {
    display: flex; align-items: baseline; gap: 8px; max-width: 88%;
    margin: 0 0 8px; padding: 7px 11px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line);
    font-size: 13px; color: var(--dim);
  }
  .chip .tool { color: var(--accent); font-weight: 600; font-family: ui-monospace, monospace; flex: none; }
  .chip .args { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, monospace; font-size: 12px; }
  .note { text-align: center; color: var(--dim); font-size: 13px; margin: 10px 0; white-space: pre-line; }
  .note.error { color: var(--danger); }

  form.compose {
    display: flex; gap: 8px; padding: 10px 12px;
    background: var(--panel); border-top: 1px solid var(--line);
  }
  form.compose textarea {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px;
    background: var(--panel-2); color: var(--text); font: inherit;
    padding: 10px 12px; max-height: 120px; outline: none;
  }
  form.compose button {
    border: 0; border-radius: 12px; padding: 0 18px; font: inherit; font-weight: 600;
    background: var(--accent); color: #06281c;
  }
  form.compose button:disabled { opacity: 0.4; }
  form.compose #attach {
    background: var(--panel-2); border: 1px solid var(--line); padding: 0 12px; font-size: 18px;
  }
  .thumbs { display: flex; gap: 8px; padding: 0 12px; background: var(--panel); }
  .thumbs:not(:empty) { padding-top: 10px; }
  .thumbs .thumb { position: relative; }
  .thumbs img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); display: block; }
  .thumbs .remove {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%;
    border: 0; background: var(--danger); color: #fff; font-size: 11px; line-height: 20px; padding: 0;
  }
  .msg.user img { max-width: 100%; border-radius: 10px; display: block; margin-bottom: 6px; }
  .popover { background: var(--panel); border-top: 1px solid var(--line); max-height: 40vh; overflow-y: auto; }
  .pop-item {
    display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left;
    padding: 12px 14px; background: none; border: 0; border-bottom: 1px solid var(--line);
    color: var(--text); font: inherit;
  }
  .pop-name { font-family: ui-monospace, monospace; font-size: 14px; color: var(--accent); flex: none; }
  .pop-desc { color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 10;
    display: none; align-items: flex-end;
  }
  .sheet-backdrop.open { display: flex; }
  .sheet {
    width: 100%; background: var(--panel); border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  .sheet h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .sheet .hint { color: var(--dim); font-size: 13px; margin-bottom: 14px; }
  .sheet button {
    display: block; width: 100%; margin-bottom: 8px; padding: 13px;
    border: 1px solid var(--line); border-radius: 12px; font: inherit; font-weight: 600;
    background: var(--panel-2); color: var(--text); text-align: center;
  }
  .sheet button[data-value="yes"], .sheet button.affirm { background: var(--accent); color: #06281c; border-color: transparent; }
  .sheet button[data-value="no"] { background: transparent; color: var(--danger); border-color: var(--danger); }
  .sheet button[data-value="always"] { background: var(--panel-2); color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
  <header>
    <div class="dot" id="dot"></div>
    <div>
      <div class="title">Tackle Remote</div>
      <div class="sub" id="session">connecting…</div>
    </div>
    <div class="spacer"></div>
    <div class="budget">
      <div><b id="spent">$0.00</b> / <span id="limit">$0.00</span></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <button type="button" class="clear-btn" id="clear" title="Clear conversation">✕</button>
  </header>

  <main id="feed"></main>

  <div class="popover" id="popover" hidden></div>

  <div class="thumbs" id="thumbs"></div>

  <form class="compose" id="compose">
    <button type="button" id="attach" title="Attach a photo">📷</button>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <textarea id="input" rows="1" placeholder="Ask Tackle anything…" enterkeyhint="send"></textarea>
    <button type="submit" id="send">Send</button>
  </form>

  <div class="sheet-backdrop" id="backdrop">
    <div class="sheet">
      <h2 id="q-label"></h2>
      <div class="hint" id="q-hint"></div>
      <div id="q-options"></div>
    </div>
  </div>

<script>
(() => {
  // The single-use ?pair= code was traded for an HttpOnly session cookie by
  // the server; strip it from the URL so it can't be re-shared from history.
  if (location.search.includes('pair=')) history.replaceState(null, '', '/');

  // Auth rides the HttpOnly cookie automatically on same-origin fetches.
  const headers = { 'Content-Type': 'application/json' };

  const feed = document.getElementById('feed');
  const dot = document.getElementById('dot');
  const backdrop = document.getElementById('backdrop');

  let cursor = 0;
  let agentBubble = null;   // the assistant bubble currently being streamed into
  let shownQuestion = null; // id of the question the sheet is showing
  let polling = false;

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  // Auto-scroll: stick to the bottom unless the user has deliberately
  // scrolled up to read history. Re-stick as soon as they return near the
  // bottom, and whenever the viewport resizes (the mobile keyboard).
  let autoScroll = true;
  const nearBottom = () => feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;
  const scrollBottom = () => requestAnimationFrame(() => { feed.scrollTop = feed.scrollHeight; });

  feed.addEventListener('scroll', () => { autoScroll = nearBottom(); });
  window.visualViewport?.addEventListener('resize', () => { if (autoScroll) scrollBottom(); });

  const render = (event) => {
    switch (event.type) {
      case 'user': {
        agentBubble = null;
        const bubble = el('div', 'msg user');
        (event.images || []).forEach((id) => {
          const img = document.createElement('img');
          img.src = '/api/attachment?id=' + encodeURIComponent(id);
          bubble.appendChild(img);
        });
        bubble.appendChild(el('span', null, event.text));
        feed.appendChild(bubble);
        break;
      }
      case 'text':
        if (!agentBubble) { agentBubble = el('div', 'msg agent', ''); feed.appendChild(agentBubble); }
        agentBubble.textContent += event.delta;
        break;
      case 'tool_call': {
        agentBubble = null;
        const chip = el('div', 'chip');
        chip.appendChild(el('span', 'tool', event.tool));
        chip.appendChild(el('span', 'args', JSON.stringify(event.arguments)));
        feed.appendChild(chip);
        break;
      }
      case 'status': feed.appendChild(el('div', 'note', event.text)); break;
      case 'error': feed.appendChild(el('div', 'note error', event.text)); break;
      case 'ready': feed.appendChild(el('div', 'note', 'Agent ready.')); break;
      case 'cleared':
        agentBubble = null;
        feed.innerHTML = '';
        feed.appendChild(el('div', 'note', 'Conversation cleared.'));
        break;
      case 'turn_done': agentBubble = null; break;
    }
  };

  const showQuestion = (question) => {
    if (!question) { shownQuestion = null; backdrop.classList.remove('open'); return; }
    if (shownQuestion === question.id) return;

    shownQuestion = question.id;
    document.getElementById('q-label').textContent = question.label;
    document.getElementById('q-hint').textContent = question.hint || '';

    const box = document.getElementById('q-options');
    box.innerHTML = '';

    Object.entries(question.options).forEach(([value, label], index) => {
      const button = el('button', null, label);
      button.dataset.value = value;
      if (!['yes', 'no', 'always'].includes(value) && index === 0) button.classList.add('affirm');
      button.onclick = async () => {
        backdrop.classList.remove('open');
        await fetch('/api/answer', { method: 'POST', headers, body: JSON.stringify({ id: question.id, value }) });
      };
      box.appendChild(button);
    });

    backdrop.classList.add('open');
    if (navigator.vibrate) navigator.vibrate(80);
  };

  const applyState = (state) => {
    const pending = !!shownQuestion;
    dot.className = 'dot ' + (pending ? 'waiting' : (state.status === 'running' ? 'running' : 'idle'));
    document.getElementById('session').textContent =
      (state.session || '…') + ' · ' + (state.model || '') + (pending ? ' · needs approval' : ' · ' + (state.status || ''));

    const budget = state.budget || {};
    const spent = budget.spent_usd || 0, limit = budget.limit_usd || 0;
    document.getElementById('spent').textContent = '$' + spent.toFixed(2);
    document.getElementById('limit').textContent = '$' + limit.toFixed(2);
    const bar = document.getElementById('bar');
    const ratio = limit > 0 ? Math.min(100, (spent / limit) * 100) : 0;
    bar.style.width = ratio + '%';
    bar.className = ratio >= 80 ? 'hot' : '';
  };

  const poll = async () => {
    if (polling) return;
    polling = true;

    try {
      const response = await fetch('/api/poll?after=' + cursor, { headers });
      if (!response.ok) throw new Error('poll failed');
      const payload = await response.json();

      // A cursor moving backward means the event log was cleared while we
      // were ahead of it — reset and re-read from the start.
      if (payload.cursor < cursor) {
        agentBubble = null;
        feed.innerHTML = '';
        cursor = 0;
        polling = false;
        return poll();
      }

      payload.events.forEach(render);
      cursor = payload.cursor;
      if (payload.events.length && autoScroll) scrollBottom();
      showQuestion(payload.question);
      applyState(payload.state || {});
    } catch {
      dot.className = 'dot';
    } finally {
      polling = false;
    }
  };

  // --- Autocomplete: '/' at the start offers slash commands, '@' anywhere
  // offers workspace files (searched against the agent-published index).
  const input = document.getElementById('input');
  const popover = document.getElementById('popover');
  let commands = [];
  let fileTimer = null;

  fetch('/api/commands', { headers }).then((r) => r.json()).then((d) => { commands = d.commands || []; }).catch(() => {});

  const hidePopover = () => { popover.hidden = true; popover.innerHTML = ''; };

  const showItems = (items, apply) => {
    popover.innerHTML = '';
    if (!items.length) return hidePopover();
    items.slice(0, 8).forEach((item) => {
      const row = el('button', 'pop-item');
      row.type = 'button';
      row.appendChild(el('span', 'pop-name', item.name));
      if (item.description) row.appendChild(el('span', 'pop-desc', item.description));
      row.onclick = () => { apply(item); hidePopover(); input.focus(); };
      popover.appendChild(row);
    });
    popover.hidden = false;
  };

  input.addEventListener('input', () => {
    const value = input.value;

    const slash = value.match(/^\/([\w:-]*)$/);
    if (slash) {
      const q = slash[1].toLowerCase();
      return showItems(
        commands.filter((c) => c.name.toLowerCase().startsWith(q)),
        (item) => { input.value = '/' + item.name + ' '; },
      );
    }

    const caret = input.selectionStart ?? value.length;
    const at = value.slice(0, caret).match(/@([^\s@]*)$/);
    if (at) {
      clearTimeout(fileTimer);
      fileTimer = setTimeout(async () => {
        try {
          const r = await fetch('/api/files?q=' + encodeURIComponent(at[1]), { headers });
          const d = await r.json();
          showItems((d.files || []).map((f) => ({ name: f })), (item) => {
            input.value = value.slice(0, caret).replace(/@[^\s@]*$/, '@' + item.name + ' ') + value.slice(caret);
          });
        } catch { hidePopover(); }
      }, 150);
      return;
    }

    hidePopover();
  });

  // --- Photo attachments: downscale on-device (iPhone photos are 3-10MB
  // HEIC; a 1600px JPEG is ~300KB, reads fine, and Safari's canvas decodes
  // HEIC for free), preview in a strip, upload on send.
  const pending = []; // {blob, url}
  const thumbs = document.getElementById('thumbs');

  const downscale = (file) => new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(img.src);
      canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('encode failed')), 'image/jpeg', 0.8);
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); reject(new Error('unreadable image')); };
    img.src = URL.createObjectURL(file);
  });

  const renderThumbs = () => {
    thumbs.innerHTML = '';
    pending.forEach((item, index) => {
      const wrap = el('div', 'thumb');
      const img = document.createElement('img');
      img.src = item.url;
      const remove = el('button', 'remove', '✕');
      remove.type = 'button';
      remove.onclick = () => { URL.revokeObjectURL(item.url); pending.splice(index, 1); renderThumbs(); };
      wrap.appendChild(img);
      wrap.appendChild(remove);
      thumbs.appendChild(wrap);
    });
  };

  document.getElementById('attach').addEventListener('click', () => document.getElementById('file').click());

  document.getElementById('file').addEventListener('change', async (event) => {
    for (const file of event.target.files) {
      try {
        const blob = await downscale(file);
        pending.push({ blob, url: URL.createObjectURL(blob) });
      } catch {
        feed.appendChild(el('div', 'note error', 'Could not read that image.'));
      }
    }
    event.target.value = '';
    renderThumbs();
  });

  document.getElementById('compose').addEventListener('submit', async (event) => {
    event.preventDefault();
    const send = document.getElementById('send');
    const text = input.value.trim();
    if (!text && !pending.length) return;

    hidePopover();

    // /help renders locally from the published command list — no agent turn.
    if (text === '/help') {
      const lines = commands.map((c) => '/' + c.name + (c.description ? ' — ' + c.description : ''));
      feed.appendChild(el('div', 'note', lines.join('\n') || 'No commands available.'));
      input.value = '';
      scrollBottom();
      return;
    }

    send.disabled = true;

    try {
      const images = [];

      for (const item of pending) {
        const form = new FormData();
        form.append('image', item.blob, 'photo.jpg');
        const response = await fetch('/api/upload', { method: 'POST', body: form });
        if (!response.ok) throw new Error('upload failed');
        images.push((await response.json()).id);
      }

      await fetch('/api/message', { method: 'POST', headers, body: JSON.stringify({ text, images }) });

      input.value = '';
      pending.forEach((item) => URL.revokeObjectURL(item.url));
      pending.length = 0;
      renderThumbs();
      autoScroll = true;
      poll();
      scrollBottom();
    } catch {
      feed.appendChild(el('div', 'note error', 'Send failed — check the connection and try again.'));
    } finally {
      send.disabled = false;
    }
  });

  document.getElementById('clear').addEventListener('click', async () => {
    if (!confirm('Clear the conversation? The agent forgets everything discussed so far.')) return;
    await fetch('/api/clear', { method: 'POST', headers });
    poll();
  });

  document.getElementById('input').addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      document.getElementById('compose').requestSubmit();
    }
  });

  poll();
  setInterval(poll, 400);
})();
</script>
</body>
</html>
